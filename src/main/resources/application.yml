
spring:
  application:
    name: gaslink-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gaslink}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:gaslink295@gmail.com}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  s3:
    endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:eu-west-2}
    bucket: ${S3_BUCKET:gaslink-tadova-buckets}
    enabled: ${S3_ENABLED:false}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:}
    endpoint: ${PAYSTACK_ENDPOINT:https://api.paystack.co}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  reset-token:
    expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES:30}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    first-name: ${SUPER_ADMIN_FIRST_NAME:Super}
    last-name: ${SUPER_ADMIN_LAST_NAME:Admin}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    displayRequestDuration: true
    showExtensions: true
    showCommonExtensions: true
    use-root-path: true
    defaultModelsExpandDepth: 1
    defaultModelExpandDepth: 1
    docExpansion: none
    persistAuthorization: true
  show-actuator: false
  packages-to-scan: com.gaslink.api.modules
  paths-to-match: /api/**

firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  api-key: ${TWILIO_API_KEY:}
  api-secret: ${TWILIO_API_SECRET:}
  app-sid: ${TWILIO_APP_SID:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

logging:
  level:
    org.springframework.web: INFO
    org.springdoc: INFO
    com.fasterxml.jackson: INFO
    org.springframework.mail: INFO
    com.sun.mail: INFO
    javax.mail: INFO
    org.hibernate: ERROR